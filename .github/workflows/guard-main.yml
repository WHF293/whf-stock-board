name: Guard main branch

# 免费私有仓库没有分支保护（需 GitHub Pro），用 CI 做服务端警示：
# 直接 push 到 main 的非 merge 提交会使本检查失败（PR 合并的 merge commit 不受影响）

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check main commits are merge commits
        shell: bash
        run: |
          # 取本次推送新增的提交（远端上一位置 -> 当前）
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "首次推送，跳过检查"
            exit 0
          fi
          BAD=$(git log --no-merges --format='%h %s' "$RANGE" || true)
          if [ -n "$BAD" ]; then
            echo "::error::检测到直接 push 到 main 的非 merge 提交，必须通过 Pull Request / merge 进入 main："
            echo "$BAD"
            exit 1
          fi
          echo "main 上新增提交均为 merge commit，检查通过"
