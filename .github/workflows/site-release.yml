name: Deploy Site (GitHub Pages)

# 官网发布流程（与应用版本发布完全解耦）：
# - 推送 main 且改动命中官网相关路径 → 自动构建部署到 GitHub Pages
# - Actions 手动触发 → 任意分支随时部署
# 产物：pnpm build:site（vite.config.site.ts，入口 site.html，源码 src/docs/）→ dist-site/
# 前置条件（一次性，仓库设置）：Settings → Pages → Build and deployment → Source 选
# 「GitHub Actions」，否则 deploy job 无目标环境可用。
#
# 官网不承载安装包本体：下载中心运行时直连 GitHub Releases API（1h 本地缓存 + 限流兜底），
# 因此官网部署不需要跟随版本发版，页面数据始终是最新 Release。

on:
  push:
    branches: [main]
    paths:
      - 'src/docs/**'
      - 'vite.config.site.ts'
      # 官网从 common 单源引用的文件（白皮书内容 / 类型 / 搜索工具 / 主题 token）
      - 'src/common/constants/whitepaper-content.ts'
      - 'src/common/types/whitepaper.types.ts'
      - 'src/common/utils/whitepaper-search.ts'
      - 'src/common/assets/styles/theme.css'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/site-release.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一条 Pages 部署，新部署排队替换旧部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
