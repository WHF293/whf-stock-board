name: Release Tauri App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 拉全量历史，供「tag 是否在 main / dev 上」的祖先校验使用
          fetch-depth: 0

      # 发布守卫：tag 指向的提交必须可从 main 或 dev 到达，
      # 否则视为绕过受保护分支的发布，直接失败
      - name: Verify tag is on main or dev
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || git merge-base --is-ancestor "${GITHUB_SHA}" origin/dev; then
            echo "tag ${GITHUB_REF_NAME} 位于 main 或 dev 分支历史上，允许发布"
          else
            echo "::error::tag ${GITHUB_REF_NAME} 的提交不在 main 或 dev 分支上，拒绝发布"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 从上一个 tag 到当前 HEAD 的提交主题生成带编号的变更列表，
      # 作为 Release 描述（提交须遵循 conventional commits：feat:/fix:/refactor: ...）
      - name: Generate release notes
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            SUBJECTS=$(git log --pretty=format:"%s" "${PREV_TAG}..HEAD")
          else
            SUBJECTS=$(git log --pretty=format:"%s")
          fi
          NUMBERED=$(echo "$SUBJECTS" | sed '/^$/d' | awk '{printf "%d. %s\n", NR, $0}')
          {
            echo "body<<CHANGELOG_EOF"
            echo "## 更新内容"
            echo ""
            echo "$NUMBERED"
            echo ""
            echo "下载下方 Assets 中的安装包（*_x64-setup.exe）即可安装。"
            echo ""
            echo "## 安全提示"
            echo ""
            echo "本应用未购买代码签名证书，首次运行时 Windows SmartScreen / Defender 可能提示「已保护你的电脑」或误报病毒，属无签名二进制的常见误报，安装包由 GitHub Actions 从公开源码构建，可自行审计。"
            echo "处理方式：点击「更多信息」→「仍要运行」；也可将安装包提交微软误报分析：https://www.microsoft.com/en-us/wdsi/filesubmission"
            echo ""
            echo "数据仅供个人学习参考，不构成投资建议。"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: '股票看板 v__VERSION__'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: false
          prerelease: false
