<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="mBlue" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="6.3" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="mViolet" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="6.3" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#7c3aed"/>
    </marker>
    <marker id="mGreen" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="9" markerHeight="6.3" orient="auto-start-reverse">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="1000" fill="#ffffff"/>

  <text x="600" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">股票看板 · 插件体系架构</text>
  <text x="600" y="66" text-anchor="middle" font-size="12" fill="#64748b">一切皆插件 —— 内核只做加载 / 卸载 / 依赖收敛；能力由插件贡献，卸载即全量撤销</text>

  <!-- ① 插件从哪来 -->
  <rect x="40" y="84" width="1120" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="56" y="104" font-size="11" font-weight="700" fill="#475569">① 插件从哪来 —— 产物包分发（zip 优先）</text>
  <rect x="70" y="116" width="330" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="235" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">官方插件市场</text>
  <text x="235" y="149" text-anchor="middle" font-size="10" fill="#475569">GitHub Releases · &lt;插件id&gt;-&lt;版本&gt;.zip</text>
  <rect x="435" y="116" width="330" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="600" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">第三方源 · 上限 10 个</text>
  <text x="600" y="149" text-anchor="middle" font-size="10" fill="#475569">任意 GitHub 仓库 · Releases 即填即用</text>
  <rect x="800" y="116" width="330" height="42" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="965" y="133" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">本地安装</text>
  <text x="965" y="149" text-anchor="middle" font-size="10" fill="#475569">zip 多选拖拽 · 粘贴代码 · .js 文件</text>

  <line x1="600" y1="170" x2="600" y2="202" stroke="#2563eb" stroke-width="2" marker-end="url(#mBlue)"/>
  <rect x="542" y="178" width="116" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="600" y="189" text-anchor="middle" font-size="10.5" fill="#374151">下载 / 读取产物包</text>

  <!-- ② 安装校验链 -->
  <rect x="40" y="206" width="1120" height="92" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="56" y="226" font-size="11" font-weight="700" fill="#92400e">② 安装校验链（批量并行 · 六步流水，卡在哪一步红在哪一步）</text>
  <rect x="70" y="238" width="150" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="145" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">解包</text>
  <text x="145" y="270" text-anchor="middle" font-size="9.5" fill="#6b7280">fflate 解压剥壳</text>
  <rect x="245" y="238" width="150" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">静态预检</text>
  <text x="320" y="270" text-anchor="middle" font-size="9.5" fill="#6b7280">import / template 拦截</text>
  <rect x="420" y="238" width="150" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="495" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">加载产物</text>
  <text x="495" y="270" text-anchor="middle" font-size="9.5" fill="#6b7280">Blob URL 动态 import</text>
  <rect x="595" y="238" width="150" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="670" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">结构校验</text>
  <text x="670" y="270" text-anchor="middle" font-size="9.5" fill="#6b7280">id 规则 / 必填字段</text>
  <rect x="770" y="238" width="150" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="845" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">清单一致性</text>
  <text x="845" y="270" text-anchor="middle" font-size="9.5" fill="#6b7280">manifest ↔ 产物</text>
  <rect x="945" y="238" width="150" height="42" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1020" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">包间冲突</text>
  <text x="1020" y="270" text-anchor="middle" font-size="9.5" fill="#6b7280">同 id 先到先得</text>
  <line x1="222" y1="259" x2="241" y2="259" stroke="#f59e0b" stroke-width="2" marker-end="url(#mBlue)"/>
  <line x1="397" y1="259" x2="416" y2="259" stroke="#f59e0b" stroke-width="2" marker-end="url(#mBlue)"/>
  <line x1="572" y1="259" x2="591" y2="259" stroke="#f59e0b" stroke-width="2" marker-end="url(#mBlue)"/>
  <line x1="747" y1="259" x2="766" y2="259" stroke="#f59e0b" stroke-width="2" marker-end="url(#mBlue)"/>
  <line x1="922" y1="259" x2="941" y2="259" stroke="#f59e0b" stroke-width="2" marker-end="url(#mBlue)"/>

  <line x1="600" y1="298" x2="600" y2="328" stroke="#2563eb" stroke-width="2" marker-end="url(#mBlue)"/>
  <rect x="505" y="305" width="190" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="600" y="316" text-anchor="middle" font-size="10.5" fill="#374151">校验通过 · pluginKernel.use() 挂载</text>

  <!-- ③ 插件内核 -->
  <rect x="40" y="332" width="1120" height="120" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="56" y="352" font-size="11" font-weight="700" fill="#3730a3">③ 插件内核 pluginKernel —— 只做三件事：加载 / 卸载 / 依赖收敛</text>
  <rect x="70" y="372" width="200" height="64" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="170" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">状态机</text>
  <text x="170" y="409" text-anchor="middle" font-size="9.5" fill="#6b7280">mounted · pending</text>
  <text x="170" y="423" text-anchor="middle" font-size="9.5" fill="#6b7280">disabled · failed</text>
  <rect x="290" y="372" width="200" height="64" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="390" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">依赖收敛</text>
  <text x="390" y="409" text-anchor="middle" font-size="9.5" fill="#6b7280">inject 未就绪 → pending</text>
  <text x="390" y="423" text-anchor="middle" font-size="9.5" fill="#6b7280">环形依赖不死循环</text>
  <rect x="510" y="372" width="200" height="64" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="610" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">副作用袋</text>
  <text x="610" y="409" text-anchor="middle" font-size="9.5" fill="#6b7280">卸载 = 贡献点全量回滚</text>
  <text x="610" y="423" text-anchor="middle" font-size="9.5" fill="#6b7280">可逆，无需写反向逻辑</text>
  <rect x="730" y="372" width="200" height="64" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="830" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">服务容器</text>
  <text x="830" y="409" text-anchor="middle" font-size="9.5" fill="#6b7280">provide / consume</text>
  <text x="830" y="423" text-anchor="middle" font-size="9.5" fill="#6b7280">同名服务后注册覆盖</text>
  <rect x="950" y="372" width="200" height="64" rx="8" fill="#ffffff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1050" y="392" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">事件总线</text>
  <text x="1050" y="409" text-anchor="middle" font-size="9.5" fill="#6b7280">ctx.on / ctx.emit</text>
  <text x="1050" y="423" text-anchor="middle" font-size="9.5" fill="#6b7280">订阅随卸载自动退订</text>

  <line x1="312" y1="452" x2="312" y2="516" stroke="#2563eb" stroke-width="2" marker-end="url(#mBlue)"/>
  <rect x="240" y="477" width="144" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="312" y="488" text-anchor="middle" font-size="10.5" fill="#374151">apply(ctx) 注册贡献点</text>
  <line x1="888" y1="516" x2="888" y2="456" stroke="#7c3aed" stroke-width="2" marker-end="url(#mViolet)"/>
  <rect x="816" y="479" width="144" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="888" y="490" text-anchor="middle" font-size="10.5" fill="#374151">ctx.consume 取宿主能力</text>

  <!-- ④ 九个贡献点 -->
  <rect x="40" y="520" width="545" height="196" rx="10" fill="#f0fdf4" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="56" y="540" font-size="11" font-weight="700" fill="#065f46">④ 九个贡献点（ctx.*.add · 可逆扩展宿主）</text>
  <rect x="66" y="552" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="146" y="569" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">sidebar</text>
  <text x="146" y="584" text-anchor="middle" font-size="9" fill="#4b5563">侧栏面板 inline / drawer</text>
  <rect x="240" y="552" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="320" y="569" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">menu</text>
  <text x="320" y="584" text-anchor="middle" font-size="9" fill="#4b5563">菜单 + 自动注册路由</text>
  <rect x="414" y="552" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="494" y="569" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">router</text>
  <text x="494" y="584" text-anchor="middle" font-size="9" fill="#4b5563">隐藏路由（无菜单）</text>
  <rect x="66" y="600" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="146" y="617" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">dock</text>
  <text x="146" y="632" text-anchor="middle" font-size="9" fill="#4b5563">右侧停靠面板</text>
  <rect x="240" y="600" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="320" y="617" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">header</text>
  <text x="320" y="632" text-anchor="middle" font-size="9" fill="#4b5563">顶栏条目 + 收起态轮播</text>
  <rect x="414" y="600" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="494" y="617" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">command</text>
  <text x="494" y="632" text-anchor="middle" font-size="9" fill="#4b5563">命令 + 全局快捷键</text>
  <rect x="66" y="648" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="146" y="665" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">stockRow</text>
  <text x="146" y="680" text-anchor="middle" font-size="9" fill="#4b5563">自选行内操作按钮</text>
  <rect x="240" y="648" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="320" y="665" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">stockDetail</text>
  <text x="320" y="680" text-anchor="middle" font-size="9" fill="#4b5563">个股详情扩展卡片</text>
  <rect x="414" y="648" width="160" height="40" rx="7" fill="#ecfdf5" stroke="#34d399" stroke-width="1.2"/>
  <text x="494" y="665" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">agent</text>
  <text x="494" y="680" text-anchor="middle" font-size="9" fill="#4b5563">注册 MCP 工具服务器</text>

  <!-- ⑤ 二十二个宿主服务 -->
  <rect x="615" y="520" width="545" height="196" rx="10" fill="#faf5ff" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="631" y="540" font-size="11" font-weight="700" fill="#6d28d9">⑤ 二十二个宿主服务（ctx.consume 取用）</text>
  <rect x="641" y="552" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="721" y="569" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:ui</text>
  <text x="721" y="584" text-anchor="middle" font-size="9" fill="#4b5563">12 组件 + confirm</text>
  <rect x="815" y="552" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="895" y="569" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:http</text>
  <text x="895" y="584" text-anchor="middle" font-size="9" fill="#4b5563">白名单内网络请求</text>
  <rect x="989" y="552" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="1069" y="569" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:quotes</text>
  <text x="1069" y="584" text-anchor="middle" font-size="9" fill="#4b5563">批量实时报价</text>
  <rect x="641" y="600" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="721" y="617" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:market</text>
  <text x="721" y="632" text-anchor="middle" font-size="9" fill="#4b5563">成交额 · 涨停池 · 板块</text>
  <rect x="815" y="600" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="895" y="617" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:market-data</text>
  <text x="895" y="632" text-anchor="middle" font-size="9" fill="#4b5563">成交额 · 新闻 · 热榜</text>
  <rect x="989" y="600" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="1069" y="617" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:format</text>
  <text x="1069" y="632" text-anchor="middle" font-size="9" fill="#4b5563">格式化 · 涨跌语义</text>
  <rect x="641" y="648" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="721" y="665" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:notify</text>
  <text x="721" y="680" text-anchor="middle" font-size="9" fill="#4b5563">应用级浮窗提醒</text>
  <rect x="815" y="648" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="895" y="665" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:polling</text>
  <text x="895" y="680" text-anchor="middle" font-size="9" fill="#4b5563">带退避的轮询调度</text>
  <rect x="989" y="648" width="160" height="40" rx="7" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="1069" y="665" text-anchor="middle" font-size="11" font-weight="700" fill="#6d28d9">app:stock-*</text>
  <text x="1069" y="680" text-anchor="middle" font-size="9" fill="#4b5563">打开 · 挑选 · 自选只读</text>
  <text x="887" y="708" text-anchor="middle" font-size="9" fill="#6b7280">另有 app:navigate · panel:open/close · kernel:runtime · app:agent-ask · app:version · stock-search / picker</text>

  <line x1="312" y1="716" x2="312" y2="746" stroke="#2563eb" stroke-width="2" marker-end="url(#mBlue)"/>
  <rect x="267" y="724" width="90" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="312" y="735" text-anchor="middle" font-size="10.5" fill="#374151">贡献渲染为界面</text>

  <!-- ⑥ 宿主载体 -->
  <rect x="40" y="750" width="1120" height="64" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="768" font-size="11" font-weight="700" fill="#334155">⑥ 宿主载体 MainLayout —— 只做承载与转发，不硬编码任何插件</text>
  <rect x="65" y="776" width="140" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="135" y="795" text-anchor="middle" font-size="10.5" fill="#334155">侧栏面板承载</text>
  <rect x="215" y="776" width="140" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="285" y="795" text-anchor="middle" font-size="10.5" fill="#334155">插件路由挂摘除</text>
  <rect x="365" y="776" width="140" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="435" y="795" text-anchor="middle" font-size="10.5" fill="#334155">顶栏下拉与轮播</text>
  <rect x="515" y="776" width="140" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="585" y="795" text-anchor="middle" font-size="10.5" fill="#334155">停靠面板承载</text>
  <rect x="665" y="776" width="140" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="735" y="795" text-anchor="middle" font-size="10.5" fill="#334155">浮窗·确认·选股</text>
  <rect x="815" y="776" width="140" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="885" y="795" text-anchor="middle" font-size="10.5" fill="#334155">命令与快捷键接管</text>
  <rect x="965" y="776" width="140" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="1035" y="795" text-anchor="middle" font-size="10.5" fill="#334155">个股详情扩展区</text>

  <line x1="600" y1="814" x2="600" y2="836" stroke="#059669" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#mGreen)"/>
  <rect x="533" y="818" width="134" height="15" fill="#ffffff" opacity="0.95"/>
  <text x="600" y="829" text-anchor="middle" font-size="10.5" fill="#374151">数据落盘 · 命名空间隔离</text>

  <!-- ⑦ 数据持久化 -->
  <rect x="40" y="840" width="1120" height="104" rx="10" fill="#f0fdfa" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="56" y="860" font-size="11" font-weight="700" fill="#0f766e">⑦ 数据持久化 —— 插件永不直接碰 SQL，全部走宿主 API</text>
  <rect x="70" y="872" width="330" height="56" rx="8" fill="#ffffff" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="235" y="891" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">ctx.storage / ctx.settings</text>
  <text x="235" y="907" text-anchor="middle" font-size="9.5" fill="#4b5563">localStorage whf:app · plugin:&lt;id&gt; 命名空间</text>
