[package]
name = "app"
version = "0.1.0"
description = "A 股看板（个人学习用）"
authors = ["WHF293"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# 发布产物剥离调试符号：安卓 so 23MB → 15MB（APK 25MB → ~17MB），桌面 exe 同步受益；
# 仅影响产物体积，不影响运行行为（桌面构建时长不变）
[profile.release]
strip = true

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
# unsafe-headers：允许 JS 侧显式设置 Referer 等 fetch 规范「forbidden header」——
# 天天基金 f10（ETF 持仓）等上游严格校验 Referer，插件默认会静默丢弃导致 404
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-autostart = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# 触控板三指手势（最大化 / 最小化）兼容层：WM_SYSCOMMAND 子类化，见 src/window_syscmd.rs；
# 同一子类化层还负责拖拽 / 激活后把焦点还给 WebView2（键盘事件恢复）
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
