<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182028"/>
      <stop offset="1" stop-color="#0b0e11"/>
    </linearGradient>
    <linearGradient id="candleUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0e9488"/>
    </linearGradient>
    <linearGradient id="candleDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- 深色圆角底 -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- K 线影线 -->
  <line x1="250" y1="500" x2="250" y2="740" stroke="url(#candleUp)" stroke-width="16" stroke-linecap="round"/>
  <line x1="425" y1="400" x2="425" y2="680" stroke="url(#candleUp)" stroke-width="16" stroke-linecap="round"/>
  <line x1="600" y1="380" x2="600" y2="620" stroke="url(#candleDown)" stroke-width="16" stroke-linecap="round"/>
  <line x1="775" y1="260" x2="775" y2="560" stroke="url(#candleUp)" stroke-width="16" stroke-linecap="round"/>

  <!-- K 线实体（绿涨 / 红跌回调） -->
  <rect x="200" y="560" width="100" height="140" rx="20" fill="url(#candleUp)"/>
  <rect x="375" y="460" width="100" height="160" rx="20" fill="url(#candleUp)"/>
  <rect x="550" y="440" width="100" height="120" rx="20" fill="url(#candleDown)"/>
  <rect x="725" y="320" width="100" height="150" rx="20" fill="url(#candleUp)"/>

  <!-- 均线折线 -->
  <polyline
    points="190,660 425,590 600,540 775,470 880,360"
    fill="none"
    stroke="#f59e0b"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.92"
  />
</svg>
